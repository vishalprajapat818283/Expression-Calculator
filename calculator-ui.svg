<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="60" y="50" width="1080" height="620" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="50" width="1080" height="56" rx="24" fill="#1f2937"/>
  <circle cx="95" cy="78" r="8" fill="#ef4444"/>
  <circle cx="125" cy="78" r="8" fill="#f59e0b"/>
  <circle cx="155" cy="78" r="8" fill="#22c55e"/>
  <text x="600" y="86" text-anchor="middle" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22" font-weight="700">Expression Calculator v2.0</text>

  <text x="100" y="160" fill="#cbd5e1" font-family="Consolas, monospace" font-size="24">--Enter 'exit' for stop calculation--</text>
  <text x="100" y="198" fill="#cbd5e1" font-family="Consolas, monospace" font-size="24">--Enter expression without space--</text>
  <text x="100" y="236" fill="#cbd5e1" font-family="Consolas, monospace" font-size="24">--Can evaluate decimal number--</text>
  <text x="100" y="274" fill="#cbd5e1" font-family="Consolas, monospace" font-size="22">--(-3+4) type expression is not acceptable</text>
  <text x="100" y="304" fill="#cbd5e1" font-family="Consolas, monospace" font-size="22">(unary minus not supported)--</text>

  <text x="100" y="350" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">////////available operator//////</text>
  <text x="100" y="388" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">********************</text>
  <text x="100" y="424" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">1. '-'=Subtract</text>
  <text x="100" y="458" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">2. '+'=Addition</text>
  <text x="100" y="492" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">3. '*'=Multiplication</text>
  <text x="100" y="526" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">4. '/'=Divide</text>
  <text x="100" y="560" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">5. '^'=Power</text>
  <text x="100" y="594" fill="#e5e7eb" font-family="Consolas, monospace" font-size="22">*******************</text>

  <rect x="735" y="312" width="330" height="150" rx="18" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="760" y="348" fill="#22c55e" font-family="Consolas, monospace" font-size="22">&gt;&gt;&gt; (2+3)*4</text>
  <text x="760" y="386" fill="#cbd5e1" font-family="Consolas, monospace" font-size="22">postfix expression: 2 3 + 4 *</text>
  <text x="760" y="424" fill="#cbd5e1" font-family="Consolas, monospace" font-size="22">result&gt; 20.000000</text>

  <rect x="735" y="480" width="330" height="140" rx="18" fill="#111827" stroke="#7f1d1d" stroke-width="2"/>
  <text x="760" y="516" fill="#fca5a5" font-family="Consolas, monospace" font-size="22">&gt;&gt;&gt; (2+3</text>
  <text x="760" y="554" fill="#fecaca" font-family="Consolas, monospace" font-size="22">Invalid argument:</text>
  <text x="760" y="590" fill="#fecaca" font-family="Consolas, monospace" font-size="22">bracket matching issue</text>
</svg>
