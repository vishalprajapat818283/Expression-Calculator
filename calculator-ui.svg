<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="60" y="50" width="1080" height="620" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="50" width="1080" height="56" rx="24" fill="#d1d5db"/>
  <circle cx="95" cy="78" r="8" fill="#ef4444"/>
  <circle cx="125" cy="78" r="8" fill="#f59e0b"/>
  <circle cx="155" cy="78" r="8" fill="#22c55e"/>
  <text x="600" y="87" text-anchor="middle" fill="#111827" font-family="Consolas, monospace" font-size="22" font-weight="700">Expression Calculator v2.2</text>

  <text x="100" y="160" fill="#3b82f6" font-family="Consolas, monospace" font-size="24">--Enter 'exit' for stop calculation--</text>
  <text x="100" y="198" fill="#3b82f6" font-family="Consolas, monospace" font-size="24">--Note: (-3+4) type expression is not acceptable--</text>
  <text x="100" y="236" fill="#3b82f6" font-family="Consolas, monospace" font-size="24">--Enter expression without space--</text>
  <text x="100" y="274" fill="#3b82f6" font-family="Consolas, monospace" font-size="24">--Can evaluate decimal number--</text>

  <text x="100" y="338" fill="#facc15" font-family="Consolas, monospace" font-size="24">////////available operator//////</text>
  <text x="100" y="374" fill="#d946ef" font-family="Consolas, monospace" font-size="22">********************</text>
  <text x="100" y="408" fill="#facc15" font-family="Consolas, monospace" font-size="22">1. '-'=Subtract</text>
  <text x="100" y="442" fill="#facc15" font-family="Consolas, monospace" font-size="22">2. '+'=Addition</text>
  <text x="100" y="476" fill="#facc15" font-family="Consolas, monospace" font-size="22">3. '*'=Multiplication</text>
  <text x="100" y="510" fill="#facc15" font-family="Consolas, monospace" font-size="22">4. '/'=Divide</text>
  <text x="100" y="544" fill="#facc15" font-family="Consolas, monospace" font-size="22">5. '^'=Power</text>
  <text x="100" y="578" fill="#d946ef" font-family="Consolas, monospace" font-size="22">*******************</text>

  <rect x="680" y="286" width="430" height="200" rx="18" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="705" y="324" fill="#22c55e" font-family="Consolas, monospace" font-size="21">&gt;&gt;&gt; (2+3)*4</text>
  <text x="705" y="358" fill="#3b82f6" font-family="Consolas, monospace" font-size="20">postfix expression:</text>
  <text x="725" y="386" fill="#e5e7eb" font-family="Consolas, monospace" font-size="20">2 3 + 4 *</text>
  <text x="705" y="418" fill="#3b82f6" font-family="Consolas, monospace" font-size="20">prefix expression:</text>
  <text x="725" y="446" fill="#e5e7eb" font-family="Consolas, monospace" font-size="20">* + 2 3 4</text>
  <text x="705" y="478" fill="#3b82f6" font-family="Consolas, monospace" font-size="20">result&gt; 20.000000</text>

  <rect x="680" y="504" width="430" height="124" rx="18" fill="#111827" stroke="#7f1d1d" stroke-width="2"/>
  <text x="705" y="540" fill="#fca5a5" font-family="Consolas, monospace" font-size="21">&gt;&gt;&gt; (2+3</text>
  <text x="705" y="574" fill="#fecaca" font-family="Consolas, monospace" font-size="20">Invalid argument:</text>
  <text x="705" y="602" fill="#fecaca" font-family="Consolas, monospace" font-size="20">bracket matching issue</text>
</svg>
